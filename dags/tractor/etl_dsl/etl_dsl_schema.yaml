$schema: http://json-schema.org/draft-07/schema#
title: ETL DSL Schema
description: "A JSON schema for defining a DSL for ETL projects.  Defines a \u201C\
  scatter gather\u201D or extracting and transforming related sources"
type: object
definitions:
  Command:
    description: A command to be executed by the ETL project.
    oneOf:
    - type: string
    - type: object
      properties:
        operator_type:
          type: string
          description: The type of operator to be used. See https://airflow.apache.org/docs/apache-airflow/stable/_api/airflow/operators/index.html
            for more information.
        command:
          type: string
          description: The command to be executed.
      required:
      - operator_type
      - command
  StorageObject:
    description: A storage object used by the ETL project.
    oneOf:
    - type: string
      description: The path of the storage object.
    - type: object
      properties:
        url:
          type: string
          description: The URL of the storage object.
        path:
          type: string
          description: The path of the storage object.
        type:
          type: string
          enum:
          - FILE
          - DIRECTORY
          default: FILE
          description: The type of the storage object.
        name:
          type: string
          description: The name of the storage object.
        description:
          type: string
          description: The description of the storage object.
      required:
      - path
  Dataset:
    type: object
    description: A dataset used by the ETL project.
    properties:
      uri:
        type: string
        description: The URI of the dataset.
      extra:
        type: object
        description: Additional metadata for the dataset.
        additionalProperties: true
    required:
    - uri
  Task:
    description: A task to be executed by the ETL project.
    type: object
    properties:
      id:
        type: string
        description: A unique identifier for the task.
      name:
        type: string
        description: The human readable name of the task.
      description:
        type: string
        description: A markdown description of the task.
      command:
        $ref: '#/definitions/Command'
        description: The command to be executed by the task.
      inlets:
        type: array
        items:
          $ref: '#/definitions/Dataset'
        description: A list of Datasets that will trigger the task. See https://airflow.apache.org/docs/apache-airflow/stable/authoring-and-scheduling/datasets.html#what-is-a-dataset
      outlets:
        type: array
        items:
          $ref: '#/definitions/Dataset'
        description: A list of output datasets generated by the task that may trigger
          downstream tasks. See https://airflow.apache.org/docs/apache-airflow/stable/authoring-and-scheduling/datasets.html#what-is-a-dataset
    required:
    - id
    - name
    - command
    anyOf:
    - required:
      - inlets
    - required:
      - outlets
  ETLSource:
    type: object
    description: A data source for the ETL project.
    properties:
      id:
        type: string
        description: A unique identifier for the data source.
      extractor:
        $ref: '#/definitions/Task'
        description: A list of commands to extract data from the source.
      transformer:
        $ref: '#/definitions/Task'
        description: A list of commands to transform the extracted data.
      loader:
        $ref: '#/definitions/Task'
        description: A list of commands to load the transformed data.
    required:
    - id
    oneOf:
    - required:
      - extract_commands
    - required:
      - transform_commands
    - required:
      - load_commands
    anyOf:
    - required:
      - inputs
    - required:
      - outputs
  ETLProjectDefaults:
    type: object
    description: Default values to be used for the ETL project. See https://airflow.apache.org/docs/apache-airflow-providers-amazon/stable/connections/aws.html,
      https://airflow.apache.org/docs/apache-airflow-providers-google/stable/connections/gcp.html,
      etc. for more information.
    properties:
      bucket:
        type: string
        description: The name of the bucket where data will be stored.
      bucket_prefix:
        type: string
        description: A prefix to be used for all data stored in the bucket.
      bucket_scheme:
        type: string
        enum:
        - s3
        - gs
        - abfs
        description: The scheme used for accessing the bucket (e.g., s3).
        default: s3
      operator_type:
        type: string
        enum:
        - PythonOperator
        - BashOperator
        - TESOperator
        description: The default operator type to be used for executing commands.
        default: BashOperator
    oneOf:
    - required:
      - bucket
    - required:
      - bucket_prefix
    - required:
      - bucket_scheme
    - required:
      - operator_type
    - required:
      - extractor
    - required:
      - transformer
    - required:
      - loader
  ETLProject:
    type: object
    description: A collection of ETLSources.
    properties:
      id:
        type: string
        description: A unique identifier for the ETL project.
      name:
        type: string
        description: The human readable name of the ETL project.
      description:
        type: string
        description: A markdown description of the ETL project.
      defaults:
        $ref: '#/definitions/ETLProjectDefaults'
        description: Default values to be used for each source in the ETL project.
      sources:
        type: array
        items:
          $ref: '#/definitions/ETLSource'
        description: A list of data sources for the ETL project.
      loader:
        type: array
        items:
          $ref: '#/definitions/Task'
        description: Commands to load the transformed data into the target system.
    required:
    - id
    - defaults
    - sources
