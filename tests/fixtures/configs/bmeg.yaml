id: bmeg

load_commands:
    - echo "load-all"

defaults:
    bucket: EllrottLab
    bucket_prefix: bmeg
    bucket_scheme: s3
    operator_type: airflow-operator://BashOperator
    extract_commands:
        - echo "extract"
    transform_commands:
        - echo "transform"

sources:
- id: gdc
  extract_commands:
  - python3 transform/gdc/download.py
  - python3 transform/gdc/lookups.py
  outputs:
  - source/gdc/cases.json
  - source/gdc/compounds
  - source/gdc/project_lookup.tsv
  - source/gdc/id_lookup.tsv
- id: gdsc
  extract_commands:
  - wget https://cog.sanger.ac.uk/cmp/download/model_list_20191104.csv -O source/gdsc/model_list_20191104.csv
  outputs:
  - source/gdsc/model_list_20191104.csv
- id: ccle
  extract_commands:
  - curl -L -o source/ccle/CCLE_depMap_19Q1_TPM_transcripts.csv https://depmap.org/portal/download/api/download/external?file_name=ccle%2Fdepmap-rnaseq-expression-data-ccd0.12%2FCCLE_depMap_19Q1_TPM_transcripts.csv
  - python3 transform/ccle/cellline_lookups.py
  - wget https://data.broadinstitute.org/ccle/CCLE_DepMap_18q3_RNAseq_RPKM_20180718.gct
    -O source/ccle/CCLE_DepMap_18q3_RNAseq_RPKM_20180718.gct
  - curl -L -o source/ccle/CCLE_depMap_19Q1_TPM.csv https://depmap.org/portal/download/api/download/external?file_name=ccle%2Fdepmap-rnaseq-expression-data-ccd0.12%2FCCLE_depMap_19Q1_TPM.csv
  - wget https://depmap.org/portal/download/api/download/external?file_name=processed_portal_downloads%2Fdepmap-public-cell-line-metadata-183e.4%2FDepMap-2019q1-celllines_v2.csv
    -O source/ccle/DepMap-2019q1-celllines.csv_v2.csv
  - curl -L -o source/ccle/sample_info.csv https://ndownloader.figshare.com/files/22629137
  - wget https://data.broadinstitute.org/ccle/CCLE_DepMap_18q3_maf_20180718.txt -O
    source/ccle/CCLE_DepMap_18q3_maf_20180718.txt
  outputs:
  - source/ccle/CCLE_depMap_19Q1_TPM_transcripts.csv
  - source/ccle/cellline_id_lookup.tsv
  - source/ccle/cellline_phenotype_lookup.tsv
  - source/ccle/cellline_properties_lookup.tsv
  - source/ccle/CCLE_DepMap_18q3_RNAseq_RPKM_20180718.gct
  - source/ccle/CCLE_depMap_19Q1_TPM.csv
  - source/ccle/DepMap-2019q1-celllines.csv_v2.csv
  - source/ccle/sample_info.csv
  - source/ccle/CCLE_DepMap_18q3_maf_20180718.txt
- id: go
  extract_commands:
  - curl --verbose --progress-bar --ipv4 --connect-timeout 8 --max-time 120 --retry
    128 --ftp-ssl --disable-epsv --ftp-pasv ftp://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/idmapping/by_organism/HUMAN_9606_idmapping.dat.gz
    --output source/go/HUMAN_9606_idmapping.dat.gz
  outputs:
  - source/go/HUMAN_9606_idmapping.dat.gz
- id: pharmacodb
  extract_commands:
  - curl -o source/pharmacodb/pharmacodb-1.1.1.sql https://zenodo.org/record/1143645/files/pharmacodb-1.1.1.sql
  - sifter run source/pharmacodb/pharmacodb.yaml --o source/pharmacodb/
  outputs:
  - source/pharmacodb/pharmacodb-1.1.1.sql
  - source/pharmacodb/cell_tissues.tsv.gz
  - source/pharmacodb/cellosaurus.tsv.gz
  - source/pharmacodb/cells.tsv.gz
  - source/pharmacodb/dataset_cells.tsv.gz
  - source/pharmacodb/datasets.tsv.gz
  - source/pharmacodb/dose_responses.tsv.gz
  - source/pharmacodb/drug_annots.tsv.gz
  - source/pharmacodb/drugs.tsv.gz
  - source/pharmacodb/experiments.tsv.gz
  - source/pharmacodb/profiles.tsv.gz
  - source/pharmacodb/source_cell_names.tsv.gz
  - source/pharmacodb/source_drug_names.tsv.gz
  - source/pharmacodb/source_statistics.tsv.gz
  - source/pharmacodb/source_tissue_names.tsv.gz
  - source/pharmacodb/sources.tsv.gz
  - source/pharmacodb/tissues.tsv.gz
- id: dgidb
  extract_commands:
  - wget --verbose -O source/dgidb/interactions.tsv http://www.dgidb.org/data/interactions.tsv
  outputs:
  - source/dgidb/interactions.tsv
- id: meta
  outputs:
  - bmeg-source-data-papers.tsv
- id: ensembl
  extract_commands:
  - paste <(zcat source/ensembl/Homo_sapiens.GRCh37.85.uniprot.tsv.gz | sed '1d' |
    cut -f 2) <(zcat source/ensembl/Homo_sapiens.GRCh37.85.uniprot.tsv.gz | sed '1d'
    | cut -f 1) > source/ensembl/transcript_gene_lookup.tsv
  outputs:
  - source/ensembl/transcript_gene_lookup.tsv
- id: gene_enricher
  extract_commands:
  - curl --verbose --progress-bar --ipv4 --connect-timeout 8 --max-time 120 --retry
    128 --ftp-ssl --disable-epsv --ftp-pasv ftp://ftp.ebi.ac.uk/pub/databases/genenames/new/json/hgnc_complete_set.json
    --output source/gene_enricher/hgnc_complete_set.json
  outputs:
  - source/gene_enricher/hgnc_complete_set.json
- id: mondo
  extract_commands:
  - wget -O source/mondo/mondo.json http://purl.obolibrary.org/obo/mondo.json
  outputs:
  - source/mondo/mondo.json
- id: msigdb
  extract_commands:
  - wget --verbose -O source/msigdb/msigdb_v6.2.xml ftp://ftp.broadinstitute.org/pub/gsea/xml/msigdb_v6.2.xml
  outputs:
  - source/msigdb/msigdb_v6.2.xml
