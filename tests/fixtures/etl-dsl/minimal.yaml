id: "minimal_project"
name: "Minimal ETL Project"
description: "A minimal ETL project configuration."
defaults:
  bucket: "my-bucket"
  bucket_scheme: "s3"
  bucket_prefix: "my-prefix"
  operator_type: "BashOperator"
  transformer:
    id: "transform_1"
    name: "Transform Task"
    command: "echo Transforming data"
    description: "Transform data 1"
    outputs:
      - source_1/processed-data

sources:
  - id: "source_1"
    extractor:
      id: "extract_1"
      name: "Extract Task"
      command: "echo Extracting data"
      description: "Extract data one outputs"
      outputs:
        - extracted-data