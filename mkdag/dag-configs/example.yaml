dag:
  catchup: false
  default_args:
    retries: 3
    retry_delay: 5
  description: A DAG to process gene tables from an S3 bucket
  id: gene_processing_dag
  inputs:
    gene_data: s3://my-bucket/raw/gene_table.tsv
  outputs:
    transformed_data: s3://my-bucket/processed/gene_table_cleaned.tsv
  schedule_interval: '@daily'
  sensors:
  - id: wait_for_gene_data
    mode: poke
    path: s3://my-bucket/raw/gene_table.tsv
    poke_interval: 300
    timeout: 1800
    type: s3
  start_date: '2025-01-01'
  tasks:
  - function: tasks.extract_data
    id: extract
    inputs:
    - gene_data
    type: python
    upstream:
    - condition: on_success
      task: wait_for_gene_data
  - function: tasks.transform_data
    id: transform
    inputs:
    - gene_data
    outputs:
    - transformed_data
    type: databricks
    upstream:
    - condition: on_success
      task: extract
  - function: tasks.load_data
    id: load
    inputs:
    - transformed_data
    type: kubernetes
    upstream:
    - condition: on_failure
      task: transform
